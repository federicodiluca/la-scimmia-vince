[project]
name = "scimmia"
version = "0.1.0"
description = "La Scimmia Vince: statistiche oneste (e un po' ironiche) sulle estrazioni del SuperEnalotto"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pandas>=2.2",
    "scipy>=1.14",
]

[project.scripts]
scimmia = "scimmia.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
