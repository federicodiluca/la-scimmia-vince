name: Aggiorna estrazioni

on:
  schedule:
    # Le estrazioni sono alle 20:00 (ora italiana) di mar, gio, ven e sab.
    # Primo tentativo in serata, secondo la mattina dopo nel caso il sito fosse in ritardo.
    - cron: "45 19 * * 2,4,5,6"
    - cron: "0 6 * * 3,5,6,0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # per lanciare il deploy del sito

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Test
        run: uv run pytest -q

      - name: Scarica nuove estrazioni
        run: uv run scimmia -v update

      - name: Verifica integrità dell'archivio
        run: uv run scimmia check

      - name: Commit dei dati aggiornati
        run: |
          if git diff --quiet -- data/; then
            echo "Nessuna nuova estrazione."
            exit 0
          fi
          last=$(tail -n 1 data/superenalotto/draws.csv | cut -d, -f1,2)
          git config user.name "la-scimmia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "🐒 Dati aggiornati: concorso ${last}"
          git push
          # i push fatti con GITHUB_TOKEN non avviano altri workflow: il deploy va lanciato a mano
          gh workflow run deploy-site.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
