name: Pubblica il sito

on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "data/**", "pyproject.toml", "uv.lock", ".github/workflows/deploy-site.yml"]
  # lanciato anche da update-data.yml dopo ogni nuova estrazione
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv non pubblica tag di sola major
        with:
          enable-cache: true

      - name: Statistiche in JSON
        run: uv run scimmia stats --out site/src/data/generated

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build Astro
        working-directory: site
        run: |
          npm ci
          npm test
          npm run check
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
